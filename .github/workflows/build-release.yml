name: Build and publish Debian release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: debian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_validate:
    name: Test and build the exact tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag_commit: ${{ steps.pin.outputs.commit }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Check out the pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and pin tag target
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          tag_commit="$(git rev-parse --verify "$GITHUB_REF^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tag_commit" == "$checkout_commit" ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "Pinned tag $GITHUB_REF_NAME to $tag_commit"

      - name: Install offline test and Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dpkg-dev dh-python python3 python3-pyqt6 rsync

      - name: Run offline unit tests (no device operations)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: /usr/bin/python3 scripts/run_release_tests.py

      - name: Compile Python
        run: |
          /usr/bin/python3 -m compileall -q src tests scripts
          find src tests scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Build Debian source and binary packages
        run: dpkg-buildpackage -us -uc

      - name: Stage candidate build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundle/assets
          shopt -s nullglob
          candidates=(../*.deb ../*.changes ../*.buildinfo ../*.dsc ../*.tar.*)
          if (( ${#candidates[@]} == 0 )); then
            echo "No Debian build outputs were produced" >&2
            exit 1
          fi
          cp -- "${candidates[@]}" release-bundle/assets/

      - name: Validate package identity and checksums
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            > "$RUNNER_TEMP/existing-release-tags.txt"
          version="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          /usr/bin/python3 scripts/release_gate.py \
            --tag "$GITHUB_REF_NAME" \
            --tag-commit "${{ steps.pin.outputs.commit }}" \
            --checkout-commit "$(git rev-parse --verify 'HEAD^{commit}')" \
            --changelog debian/changelog \
            --artifacts release-bundle/assets \
            --manifest-output release-bundle/manifest.json \
            --release-tags-file "$RUNNER_TEMP/existing-release-tags.txt"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload validated release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish only the verified release candidate
    needs: build_validate
    if: ${{ needs.build_validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_BUILD_SHA: ${{ needs.build_validate.outputs.tag_commit }}
      EXPECTED_VERSION: ${{ needs.build_validate.outputs.version }}
    steps:
      - name: Check out the pushed tag again
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle

      - name: Recheck tag, commit, and transferred artifact hashes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          tag_commit="$(git rev-parse --verify "$GITHUB_REF^{commit}")"
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tag_commit" == "$checkout_commit" ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$EXPECTED_BUILD_SHA" ]]
          [[ "$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)" == "$EXPECTED_VERSION" ]]
          /usr/bin/python3 - "$RUNNER_TEMP/release-bundle" "$GITHUB_REF_NAME" "$EXPECTED_VERSION" "$tag_commit" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          tag, version, commit = sys.argv[2:]
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest != {
              "schema": 1,
              "tag": tag,
              "version": version,
              "commit": commit,
              "assets": manifest.get("assets"),
          }:
              raise SystemExit("candidate manifest identity mismatch")
          assets_dir = root / "assets"
          entries = manifest["assets"]
          names = [item["name"] for item in entries]
          if len(names) != 5 or len(set(names)) != len(names):
              raise SystemExit("candidate manifest has missing or duplicate assets")
          if {p.name for p in assets_dir.iterdir()} != set(names):
              raise SystemExit("candidate asset directory differs from manifest")
          for item in entries:
              path = assets_dir / item["name"]
              if not path.is_file() or path.is_symlink() or path.stat().st_size <= 0:
                  raise SystemExit(f"invalid candidate asset: {path.name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"] or path.stat().st_size != item["size"]:
                  raise SystemExit(f"candidate asset hash/size mismatch: {path.name}")
          PY
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Reject an existing release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
            > "$RUNNER_TEMP/existing-release-tags.txt"
          /usr/bin/python3 - "$EXPECTED_VERSION" "$RUNNER_TEMP/existing-release-tags.txt" <<'PY'
          import sys
          version = sys.argv[1]
          tags = [line.strip() for line in open(sys.argv[2], encoding="utf-8") if line.strip()]
          existing = [tag for tag in tags if tag.removeprefix("v") == version]
          if existing:
              raise SystemExit(f"GitHub Release already exists for version {version}: {existing}")
          PY

      - name: Create a new unpublished draft Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$GITHUB_REF_NAME" \
            -f "name=$GITHUB_REF_NAME" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq '.id')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Created draft release id=$release_id"

      - name: Upload assets to the newly-created draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${{ steps.release.outputs.id }}"
          upload_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.upload_url' \
            | sed 's/{?name,label}$//')"
          [[ "$upload_url" == https://uploads.github.com/* ]]
          for asset in "$RUNNER_TEMP/release-bundle/assets/"*; do
            [[ -f "$asset" && ! -L "$asset" && -s "$asset" ]]
            name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg value "$name" '$value | @uri')"
            curl --fail-with-body --silent --show-error --retry 2 \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset" \
              "$upload_url?name=$encoded_name" > /dev/null
          done

      - name: Verify uploaded asset digests before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${{ steps.release.outputs.id }}"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            > "$RUNNER_TEMP/uploaded-assets.json"
          /usr/bin/python3 - "$RUNNER_TEMP/release-bundle" "$RUNNER_TEMP/uploaded-assets.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          uploaded = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          by_name = {item["name"]: item for item in uploaded}
          expected = {item["name"]: item for item in manifest["assets"]}
          if set(by_name) != set(expected):
              raise SystemExit("uploaded Release asset list is incomplete or contains extras")
          for name, item in expected.items():
              remote = by_name[name]
              expected_digest = "sha256:" + item["sha256"]
              if remote.get("state") != "uploaded" or remote.get("size") != item["size"]:
                  raise SystemExit(f"uploaded Release asset is incomplete: {name}")
              if remote.get("digest") != expected_digest:
                  raise SystemExit(f"uploaded Release asset digest mismatch/unavailable: {name}")
          PY

      - name: Publish the verified draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="${{ steps.release.outputs.id }}"
          published="$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false)"
          [[ "$(printf '%s' "$published" | jq -r '.tag_name')" == "$GITHUB_REF_NAME" ]]
          [[ "$(printf '%s' "$published" | jq -r '.draft')" == "false" ]]
