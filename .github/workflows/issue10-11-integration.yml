name: Portable System Creator offline validation
on:
  push:
    branches:
      - main
      - review/issue10-11-integration-20261123
  pull_request:
    branches:
      - main
      - review/issue10-11-integration-20261123

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install PyQt6 from system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-pyqt6
      - name: Run offline unit tests (no device operations)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Compile Python
        run: /usr/bin/python3 -m compileall -q src tests
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD
